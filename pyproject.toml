[project]
name = "lab12-crm"
version = "0.1.0"
description = "CRM for sales department — Lab 12, variant 6"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "faker>=25.0",
    "ruff>=0.4",
    "bandit>=1.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",   # line too long — handled by formatter
    "UP017",  # datetime.UTC alias — timezone.utc is clearer for explicit imports
    "UP042",  # StrEnum — SQLAlchemy sa.Enum integrates better with classic enum.Enum
    "UP046",  # PEP 695 generics — keep Generic[T] for clarity and broad tooling support
]

[tool.coverage.run]
source = ["app"]
concurrency = ["thread", "greenlet"]
omit = [
    "app/services/bad_deal.py",
    "scripts/*",
    "app/main.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
